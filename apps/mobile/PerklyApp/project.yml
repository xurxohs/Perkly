name: PerklyApp
options:
  bundleIdPrefix: com.perkly
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7N6P8A9T3V
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_CFBundleDisplayName: "Perkly"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.shopping"

targets:
  PerklyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - PerklyAppUITests
      gatherCoverageData: false
    sources:
      - PerklyApp
    dependencies:
      - target: PerklyWidgets
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.perkly.app.dev
          CODE_SIGN_ENTITLEMENTS: PerklyApp/PerklyApp.debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.perkly.app
          CODE_SIGN_ENTITLEMENTS: PerklyApp/PerklyApp.entitlements
    info:
      path: PerklyApp/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Мы используем вашу локацию для поиска скидок рядом с вами."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Приложению нужен доступ к локации в фоновом режиме, чтобы уведомлять вас о скидках, когда вы проходите мимо заведений."
        NSLocationAlwaysUsageDescription: "Это позволит вам не пропускать выгодные предложения рядом с вами."
        NSCameraUsageDescription: "Камера нужна для AR-поиска предложений рядом с вами."
        NSFaceIDUsageDescription: "Face ID защищает доступ к вашему профилю, покупкам и сообщениям Perkly."
        NSMotionUsageDescription: "Движение устройства используется только для визуального перелива карты баллов Perkly."
        UIBackgroundModes: [location, remote-notification]
        CFBundleDisplayName: Perkly

  PerklyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PerklyAppUITests
    dependencies:
      - target: PerklyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.perkly.app.dev.uitests
        CODE_SIGN_STYLE: Automatic

  PerklyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PerklyWidgets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.perkly.app.dev.widgets
          CODE_SIGN_ENTITLEMENTS: PerklyWidgets/PerklyWidgets.debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.perkly.app.widgets
          CODE_SIGN_ENTITLEMENTS: PerklyWidgets/PerklyWidgets.entitlements
